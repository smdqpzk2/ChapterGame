<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>畫冊修復師 - 第一章：溫暖的線條</title>
    <style>
        :root {
            --bg-color: #121110;
            --dialog-bg: rgba(20, 18, 16, 0.92);
            --border-color: #d4c5a9;
            --text-gold: #d99b26;
            --text-gold-light: #f7d58b;
            --text-white: #f4eee1;
            --font-serif: 'Georgia', 'Noto Serif TC', 'PMingLiU', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: var(--font-serif);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-stage {
            position: relative;
            width: 1000px;
            height: 562px;
            background-color: #000000;
            border: 4px solid #3a2e2b;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        .intro-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #0c0b0a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 300;
            opacity: 1;
            transition: opacity 1.2s ease;
        }

        .intro-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .intro-title {
            font-size: 2.2rem;
            color: var(--text-gold-light);
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(217, 155, 38, 0.6);
            opacity: 0;
            transform: translateY(10px);
            animation: introTextAnim 2.5s ease forwards;
        }

        @keyframes introTextAnim {
            0% { opacity: 0; transform: translateY(10px); }
            30% { opacity: 1; transform: translateY(0); }
            70% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }

        .shake-effect {
            animation: screenShake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes screenShake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 1px, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, -2px, 0); }
            40%, 60% { transform: translate3d(6px, 2px, 0); }
        }

        .flash-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #ffffff;
            opacity: 0;
            pointer-events: none;
            z-index: 150;
            transition: opacity 0.1s ease;
        }

        .flash-overlay.active {
            opacity: 1;
            animation: flashFade 1.5s forwards ease-out;
        }

        @keyframes flashFade {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        .main-game-layer {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
        }

        canvas#stageCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        .dialogue-box {
            position: absolute;
            bottom: 15px; left: 50%;
            transform: translateX(-50%);
            width: 94%;
            height: 140px;
            background: var(--dialog-bg);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 18px 25px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6), 0 0 15px rgba(212, 197, 169, 0.15);
            transition: opacity 1s ease, transform 1s ease;
        }

        .dialogue-box.hide-fade {
            opacity: 0;
            transform: translate(-50%, 20px);
            pointer-events: none;
        }

        .speaker-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-gold);
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(217, 155, 38, 0.3);
        }

        .dialogue-text {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-white);
            white-space: pre-line;
        }

        .next-indicator {
            position: absolute;
            bottom: 12px; right: 20px;
            font-size: 0.9rem;
            color: var(--text-gold);
            display: none;
        }

        .next-indicator.blink {
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(3px); }
        }

        .choices-container {
            position: absolute;
            top: 42%; left: 50%;
            transform: translate(-50%, -50%);
            width: 65%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 20;
        }

        .choice-btn {
            position: relative;
            background: rgba(18, 15, 13, 0.92);
            border: 1px solid var(--border-color);
            color: var(--text-white);
            padding: 14px 22px;
            font-family: inherit;
            font-size: 1.05rem;
            text-align: center;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.7);
            overflow: hidden;
            opacity: 0;
            transform: translateY(15px) scale(0.95);
            animation: optionPopIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.27) forwards;
            transition: background 0.25s ease, border-color 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
        }

        @keyframes optionPopIn {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .choice-btn:hover {
            background: linear-gradient(135deg, rgba(217, 155, 38, 0.95) 0%, rgba(180, 120, 20, 0.95) 100%);
            color: #0d0c0b;
            font-weight: bold;
            border-color: #fff2d1;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(217, 155, 38, 0.5);
        }

        .choice-btn.falling {
            animation: buttonRotateFade 0.8s ease-in-out forwards !important;
            pointer-events: none;
        }

        @keyframes buttonRotateFade {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            20% { transform: translateY(-8px) rotate(-2deg); opacity: 1; }
            100% { transform: translateY(300px) rotate(15deg); opacity: 0; }
        }

        .choice-btn.fade-out {
            animation: buttonFadeOut 0.4s ease forwards !important;
            pointer-events: none;
        }

        @keyframes buttonFadeOut {
            to { opacity: 0; transform: scale(0.9); }
        }
    </style>
</head>
<body>

    <div class="game-stage" id="gameStage">
        <div id="introOverlay" class="intro-overlay">
            <div class="intro-title">第一章：溫暖的線條</div>
        </div>

        <div id="flashOverlay" class="flash-overlay"></div>

        <div id="mainGameLayer" class="main-game-layer">
            <canvas id="stageCanvas" width="1000" height="562"></canvas>

            <div class="dialogue-box" id="dialogueBox">
                <div class="speaker-name" id="speakerName">---</div>
                <div class="dialogue-text" id="dialogueText"></div>
                <div class="next-indicator" id="nextIndicator">▼</div>
            </div>

            <div class="choices-container" id="choicesContainer"></div>
        </div>
    </div>

    <!-- 引用共用對話系統 -->
    <script src="dialogueSystem.js"></script>
    <script>
        const SPREAD_BACKGROUNDS = {
            spread0: { type: 'image', src: './Picture/Chapter1/D.png' }, 
            spread1: { type: 'image', src: './Picture/Chapter1/B.png' }, 
            spread2: { type: 'image', src: './Picture/Chapter1/C.png' }    
        };

        const loadedSpreadImages = {};
        Object.keys(SPREAD_BACKGROUNDS).forEach(key => {
            const bg = SPREAD_BACKGROUNDS[key];
            if (bg.type === 'image' && bg.src) {
                const img = new Image();
                img.src = bg.src;
                img.onload = () => { loadedSpreadImages[key] = { loaded: true, img: img }; };
                img.onerror = () => { loadedSpreadImages[key] = { loaded: false }; };
            }
        });

        const ladderImg = new Image();
        ladderImg.src = 'file:///C:/Users/dojcs/OneDrive/桌面/遊戲/專案/Picture/Chapter1/E.png'; 
        let ladderImgLoaded = false;
        ladderImg.onload = () => { ladderImgLoaded = true; };
        ladderImg.onerror = () => { ladderImgLoaded = false; };

        const ladderPlacedImg = new Image();
        ladderPlacedImg.src = 'file:///C:/Users/dojcs/OneDrive/桌面/遊戲/專案/Picture/Chapter1/F.png'; 
        let ladderPlacedImgLoaded = false;
        ladderPlacedImg.onload = () => { ladderPlacedImgLoaded = true; };
        ladderPlacedImgLoaded.onerror = () => { ladderPlacedImgLoaded = false; };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTypeSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400 + Math.random() * 100, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        }

        function playClickSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playSuccessSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
            osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function triggerFlashEffect() {
            const flash = document.getElementById('flashOverlay');
            const stage = document.getElementById('gameStage');
            flash.classList.remove('active');
            stage.classList.remove('shake-effect');
            void flash.offsetWidth;
            flash.classList.add('active');
            stage.classList.add('shake-effect');
            setTimeout(() => stage.classList.remove('shake-effect'), 500);
        }

        const canvas = document.getElementById('stageCanvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;
        const pageW = W / 2;
        const spreadW = W;

        const totalSpreads = 3;
        const totalBookW = spreadW * totalSpreads;

        let currentSpread = 1; 
        let isLadderExtracted = false;
        let isDialogueFinished = false; // 控制翻書按鈕與呼吸動畫顯示

        const targetLock = { x: pageW * 0.25, y: 200, radius: 30 };

        let draggableLadder = {
            x: spreadW * 2 + pageW * 1.25,
            y: 325,
            radius: 40,
            width: 640,    
            height: 360,   
            isDragging: false,
            dragMode: 'primary',
            dragOffsetX: 0,
            dragOffsetY: 0
        };

        const prevBtnArea = { x: 25, y: 15, w: 45, h: 45, symbol: '‹', hover: false };
        const nextBtnArea = { x: W - 70, y: 15, w: 45, h: 45, symbol: '›', hover: false };
        const nextChapterBtnArea = { x: 25, y: 20, w: 120, h: 40, hover: false };

        function drawSpreadBackground(spreadIndex) {
            const key = `spread${spreadIndex}`;
            const bgConf = SPREAD_BACKGROUNDS[key];

            ctx.save();
            if (bgConf && bgConf.type === 'image' && loadedSpreadImages[key] && loadedSpreadImages[key].loaded) {
                ctx.drawImage(loadedSpreadImages[key].img, 0, 0, W, H);
            } else {
                ctx.fillStyle = (bgConf && (bgConf.color || bgConf.src)) ? (bgConf.color || bgConf.src) : '#f2ebd9';
                ctx.fillRect(0, 0, W, H);
            }
            ctx.restore();
        }

        function renderCanvas(time = 0) {
            ctx.clearRect(0, 0, W, H);
            drawSpreadBackground(currentSpread);

            ctx.save();
            ctx.beginPath();
            ctx.rect(0, 0, W, H);
            ctx.clip();

            const currentSpreadOffset = currentSpread * spreadW;
            let ladderScale = 0.9; 

            if (isLadderExtracted) {
                ladderScale = 1.0;
            } else {
                const targetNearX = spreadW * 1.5; 
                const distance = Math.abs(draggableLadder.x - targetNearX);
                const maxDistance = 500; 

                if (distance < maxDistance) {
                    const factor = 1 - (distance / maxDistance);
                    ladderScale = 0.9 + (1.5 * factor); 
                } else {
                    ladderScale = 0.9; 
                }
            }

            if (!isLadderExtracted) {
                let viewX = draggableLadder.x - currentSpreadOffset;
                let viewY = draggableLadder.y;

                drawLadder(viewX, viewY, ladderScale);

                if (draggableLadder.x > totalBookW - draggableLadder.radius) {
                    drawLadder(viewX - totalBookW, viewY, ladderScale);
                } else if (draggableLadder.x < draggableLadder.radius) {
                    drawLadder(viewX + totalBookW, viewY, ladderScale);
                }
            } else {
                drawLadder(targetLock.x - currentSpreadOffset, targetLock.y + 10, ladderScale);
            }

            ctx.restore();
            
            // 只有對話完全結束後才顯示翻書按鈕
            if (isDialogueFinished) {
                drawPageButtons(time);
            }

            if (isLadderExtracted && currentSpread === 0) {
                drawPureGoldenGlowEffect(time);
            }

            requestAnimationFrame(renderCanvas);
        }

        function drawLadder(x, y, scale = 1.0) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            if (isLadderExtracted && ladderPlacedImgLoaded) {
                const drawW = draggableLadder.width;
                const drawH = draggableLadder.height;
                ctx.drawImage(ladderPlacedImg, -drawW / 2, -drawH / 2, drawW, drawH);
            } 
            else if (!isLadderExtracted && ladderImgLoaded) {
                const drawW = draggableLadder.width;
                const drawH = draggableLadder.height;
                ctx.drawImage(ladderImg, -drawW / 2, -drawH / 2, drawW, drawH);
            } 
            else {
                const color = draggableLadder.isDragging ? '#d99b26' : '#7a5a3a';
                ctx.strokeStyle = color;
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';

                ctx.beginPath();
                ctx.moveTo(-20, -70);
                ctx.lineTo(-20, 70);
                ctx.moveTo(20, -70);
                ctx.lineTo(20, 70);
                ctx.stroke();

                ctx.lineWidth = 4;
                for (let i = -50; i <= 50; i += 25) {
                    ctx.beginPath();
                    ctx.moveTo(-20, i);
                    ctx.lineTo(20, i);
                    ctx.stroke();
                }
            }
        }

        function drawPageButtons(time = 0) {
            if (currentSpread > 0) drawBreathingSymbolButton(prevBtnArea, time);
            if (currentSpread < totalSpreads - 1) drawBreathingSymbolButton(nextBtnArea, time);
        }

        function drawBreathingSymbolButton(btn, time) {
            ctx.save();
            const breath = (Math.sin(time * 0.0025) + 1) / 2;
            const glowBlur = btn.hover ? 16 : 6 + breath * 10;
            const alpha = btn.hover ? 1.0 : 0.6 + breath * 0.4;

            ctx.shadowColor = 'rgba(217, 155, 38, ' + (0.5 + breath * 0.5) + ')';
            ctx.shadowBlur = glowBlur;
            ctx.fillStyle = btn.hover ? '#ffe8a3' : `rgba(217, 155, 38, ${alpha})`;
            ctx.font = 'bold 42px "Georgia", "Times New Roman", serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const centerX = btn.x + btn.w / 2;
            const centerY = btn.y + btn.h / 2;
            ctx.fillText(btn.symbol, centerX, centerY);
            ctx.restore();
        }

        function drawPureGoldenGlowEffect(time = 0) {
            ctx.save();
            const breath = (Math.sin(time * 0.004) + 1) / 2;
            const centerX = 60, centerY = 40; 
            const radius = nextChapterBtnArea.hover ? 55 : 40 + breath * 15;
            const radialGrad = ctx.createRadialGradient(centerX, centerY, 2, centerX, centerY, radius);
            
            const alphaGlow = nextChapterBtnArea.hover ? 0.9 : 0.6 + breath * 0.3;
            radialGrad.addColorStop(0, `rgba(255, 225, 100, ${alphaGlow})`);
            radialGrad.addColorStop(0.5, `rgba(255, 185, 20, ${alphaGlow * 0.6})`);
            radialGrad.addColorStop(1, 'rgba(255, 215, 0, 0)');

            ctx.fillStyle = radialGrad;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function isInsideBtn(pos, btn) {
            return pos.x >= btn.x && pos.x <= btn.x + btn.w && pos.y >= btn.y && pos.y <= btn.y + btn.h;
        }

        function updateCursorAndHover(pos) {
            prevBtnArea.hover = isDialogueFinished && (currentSpread > 0) && isInsideBtn(pos, prevBtnArea);
            nextBtnArea.hover = isDialogueFinished && (currentSpread < totalSpreads - 1) && isInsideBtn(pos, nextBtnArea);
            nextChapterBtnArea.hover = isLadderExtracted && (currentSpread === 0) && isInsideBtn(pos, nextChapterBtnArea);

            if (draggableLadder.isDragging) {
                canvas.style.cursor = 'grabbing';
            } else if ((isDialogueFinished && (prevBtnArea.hover || nextBtnArea.hover)) || nextChapterBtnArea.hover) {
                canvas.style.cursor = 'pointer';
            } else {
                canvas.style.cursor = 'grab';
            }
        }

        // 全域點擊監聽：點擊畫面任一處（包含空白處、對話框外）都可以推進對話
        document.addEventListener('click', (e) => {
            // 如果點到選項按鈕、翻書按鈕、或者正在拖曳，就不觸發對話推進
            if (e.target.closest('.choice-btn') || e.target.closest('.intro-overlay')) return;
            
            if (dialogueSystem && typeof dialogueSystem.handleDialogueClick === 'function') {
                dialogueSystem.handleDialogueClick();
            }
        });

        function onPointerDown(e) {
            const pos = getPointerPos(e);

            if (isLadderExtracted && currentSpread === 0 && isInsideBtn(pos, nextChapterBtnArea)) {
                playClickSound();
                const saveData = { currentChapter: 2 };
                localStorage.setItem('repairGame_save', JSON.stringify(saveData));
                alert('即將前往第二章……');
                window.location.href = 'Chapter2.html';
                return;
            }

            if (isDialogueFinished) {
                if (currentSpread > 0 && isInsideBtn(pos, prevBtnArea)) {
                    currentSpread--;
                    playClickSound();
                    return;
                }
                if (currentSpread < totalSpreads - 1 && isInsideBtn(pos, nextBtnArea)) {
                    currentSpread++;
                    playClickSound();
                    return;
                }
            }

            if (isLadderExtracted) return;

            const worldMouseX = pos.x + currentSpread * spreadW;
            const worldMouseY = pos.y;
            const r = draggableLadder.radius + 15;

            const distPrimary = Math.hypot(worldMouseX - draggableLadder.x, worldMouseY - draggableLadder.y);

            let mirrorX = draggableLadder.x;
            if (draggableLadder.x > totalBookW - draggableLadder.radius) mirrorX -= totalBookW;
            else if (draggableLadder.x < draggableLadder.radius) mirrorX += totalBookW;

            const distMirror = Math.hypot(worldMouseX - mirrorX, worldMouseY - draggableLadder.y);

            if (distPrimary < r) {
                draggableLadder.isDragging = true;
                draggableLadder.dragMode = 'primary';
                draggableLadder.dragOffsetX = worldMouseX - draggableLadder.x;
                draggableLadder.dragOffsetY = worldMouseY - draggableLadder.y;
                playClickSound();
            } else if (distMirror < r) {
                draggableLadder.isDragging = true;
                draggableLadder.dragMode = 'seamless_mirror';
                draggableLadder.dragOffsetX = worldMouseX - mirrorX;
                draggableLadder.dragOffsetY = worldMouseY - draggableLadder.y;
                playClickSound();
            }
            updateCursorAndHover(pos);
        }

        function onPointerMove(e) {
            const pos = getPointerPos(e);
            updateCursorAndHover(pos);

            if (!draggableLadder.isDragging || isLadderExtracted) return;

            const worldMouseX = pos.x + currentSpread * spreadW;
            const worldMouseY = pos.y;

            if (draggableLadder.dragMode === 'primary') {
                draggableLadder.x = worldMouseX - draggableLadder.dragOffsetX;
            } else if (draggableLadder.dragMode === 'seamless_mirror') {
                let mirrorXOffset = (draggableLadder.x < draggableLadder.radius) ? -totalBookW : totalBookW;
                draggableLadder.x = (worldMouseX - draggableLadder.dragOffsetX) + mirrorXOffset;
            }

            draggableLadder.y = worldMouseY - draggableLadder.dragOffsetY;

            if (draggableLadder.x < 0) draggableLadder.x += totalBookW;
            if (draggableLadder.x >= totalBookW) draggableLadder.x -= totalBookW;
        }

        function onPointerUp() {
            if (!draggableLadder.isDragging || isLadderExtracted) return;
            draggableLadder.isDragging = false;
            canvas.style.cursor = 'grab';

            const distToLock = Math.hypot(draggableLadder.x - targetLock.x, draggableLadder.y - targetLock.y);
            if (distToLock < 50) {
                isLadderExtracted = true;
                draggableLadder.x = targetLock.x;
                draggableLadder.y = targetLock.y;
                playSuccessSound();
                triggerFlashEffect();
                dialogueSystem.renderNode("node_success");
            }
        }

        canvas.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        canvas.addEventListener('touchstart', onPointerDown);
        window.addEventListener('touchmove', onPointerMove);
        window.addEventListener('touchend', onPointerUp);

        const scenario = {
            "node_1": { speaker: "達米安", text: "「為什麼我會在這裡……四周的擺設跟畫冊裡一模一樣。」", spread: 1, next: "node_2" },
            "node_2": { speaker: "選擇", text: "請選擇接下來的行動：", spread: 1, options: [
                { text: "閱覽：上前試圖推開前方深鎖的大門", target: "node_door" },
                { text: "尋找：仔細搜索這間屋子的角落", target: "search_1" }
            ]},
            "search_1": { speaker: "達米安", text: "「角落堆了一些灰塵和舊紙箱，除了空氣中淡淡的墨水味外，沒有其他特別的線索。」", spread: 1, next: "node_door" },
            "node_door": { speaker: "達米安", text: "「這扇門被緊緊鎖住了，完全打不開。看來必須找到其他方法或工具來協助。」", spread: 1, next: "node_3" },
            "node_3": { speaker: "選擇", text: "請選擇接下來的行動：", spread: 1, options: [
                { text: "閱覽：轉身查看旁邊的書架與牆面", target: "node_ladder_intro" },
                { text: "尋找：檢查地面上有沒有掉落的鑰匙", target: "search_2" }
            ]},
            "search_2": { speaker: "達米安", text: "「地板上除了木紋與光影外什麼也沒有，鑰匙應該不在這裡。」", spread: 1, next: "node_ladder_intro" },
            "node_ladder_intro": { 
                speaker: "達米安", 
                text: "「等等，那邊似乎放著一個可以移動的梯子……說不定可以利用它到高處看看。」", 
                spread: 1, 
                next: null 
            },
            "node_success": { 
                speaker: "達米安", 
                text: "「太好了！成功把梯子架好了！左上角出現了金色光暈？」", 
                spread: 0, 
                next: null 
            }
        };

        const dialogueSystem = new GameDialogueSystem({
            scenario: scenario,
            initialNode: "node_1",
            playTypeSound: playTypeSound,
            playClickSound: playClickSound,
            onNodeChange: (nodeKey, node) => {
                if (node.spread !== undefined) {
                    currentSpread = node.spread;
                }
                // 當到達沒有後續結點、或是當前章節對話結束時（例如 node_ladder_intro），判定為對話完成，解鎖翻書按鈕
                if (node.next === null && !node.options) {
                    isDialogueFinished = true;
                }
            }
        });

        window.onload = () => {
            setTimeout(() => {
                const introOverlay = document.getElementById('introOverlay');
                introOverlay.classList.add('fade-out');
                
                renderCanvas();
                dialogueSystem.renderNode("node_1");
            }, 2500);
        };
    </script>

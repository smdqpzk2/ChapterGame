<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最後的修復 - 塵封的畫冊</title>
    <style>
        :root {
            --bg-color: #121110;
            --dialog-bg: rgba(20, 18, 16, 0.92);
            --border-color: #d4c5a9;
            --text-gold: #d99b26;
            --text-gold-light: #f7d58b;
            --text-white: #f4eee1;
            --font-serif: 'Georgia', 'Noto Serif TC', 'PMingLiU', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: var(--font-serif);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 遊戲舞台畫框 */
        .game-stage {
            position: relative;
            width: 1000px;
            height: 562px; /* 16:9 比例 */
            background-color: #000000;
            border: 4px solid #3a2e2b;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            cursor: pointer;
        }

        /* ===== 特效圖層：畫面震動與閃光 ===== */
        .shake-effect {
            animation: screenShake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes screenShake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 1px, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, -2px, 0); }
            40%, 60% { transform: translate3d(6px, 2px, 0); }
        }

        .flash-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #ffffff;
            opacity: 0;
            pointer-events: none;
            z-index: 150;
            transition: opacity 0.1s ease;
        }

        .flash-overlay.active {
            opacity: 1;
            animation: flashFade 1.5s forwards ease-out;
        }

        @keyframes flashFade {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* ================= Chapter 1 風格之遊戲封面遮罩層 CSS ================= */
        .title-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #0a0a0a;
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        /* 古典雙層白色邊框 (完全比照 chapter1.html) */
        .title-screen::before {
            content: '';
            position: absolute;
            top: 25px; left: 25px;
            right: 25px; bottom: 25px;
            border: 1px solid #ffffff;
            pointer-events: none;
        }

        .title-screen::after {
            content: '';
            position: absolute;
            top: 33px; left: 33px;
            right: 33px; bottom: 33px;
            border: 1px solid #ffffff;
            pointer-events: none;
        }

        .title-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .title-screen.hidden {
            display: none;
        }

        .title-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
            text-align: center;
        }

        .game-title {
            font-family: "Georgia", "Noto Serif TC", "PMingLiU", serif;
            font-size: 3.8rem;
            font-weight: bold;
            letter-spacing: 12px;
            color: #ffffff;
            text-shadow: none;
            margin-bottom: 20px;
        }

        .game-subtitle {
            font-family: "Georgia", "Noto Serif TC", "PMingLiU", serif;
            font-size: 1.35rem;
            font-style: italic;
            letter-spacing: 4px;
            color: #cccccc;
            margin-bottom: 40px;
        }

        .start-btn {
            position: relative;
            background: transparent;
            border: 1px solid #ffffff;
            color: #ffffff;
            padding: 12px 50px;
            font-family: "Georgia", "Noto Serif TC", "PMingLiU", serif;
            font-size: 1.1rem;
            letter-spacing: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: none;
        }

        .start-btn:hover {
            background: #ffffff;
            color: #0a0a0a;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
            transform: translateY(-2deg);
        }

        /* ================= 前言／章節頁遮罩層 CSS ================= */
        .prologue-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #000000;
            z-index: 100;
            opacity: 0;
            transition: opacity 1.2s ease;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            cursor: pointer;
        }

        .prologue-overlay.show {
            opacity: 1;
        }

        .prologue-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transition: opacity 1s ease, transform 8s ease;
            transform: scale(1);
        }

        .prologue-bg.zoom {
            transform: scale(1.08);
        }

        .chapter-card {
            position: relative;
            z-index: 102;
            padding: 40px 70px;
            background: rgba(18, 17, 16, 0.85);
            border: 1px solid var(--border-color);
            box-shadow: 0 0 35px rgba(0,0,0,0.95), inset 0 0 15px rgba(217, 155, 38, 0.2);
            text-align: center;
            backdrop-filter: blur(4px);
        }

        .chapter-number {
            font-size: 1.1rem;
            letter-spacing: 8px;
            color: var(--text-gold);
            margin-bottom: 12px;
        }

        .chapter-title-main {
            font-size: 2.3rem;
            letter-spacing: 12px;
            color: var(--text-gold-light);
            text-shadow: 0 0 12px rgba(217, 155, 38, 0.4);
        }

        .prologue-textbox {
            position: absolute;
            bottom: 0;
            left: 0;
            z-index: 101;
            width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 60%, rgba(0,0,0,0));
            color: var(--text-white);
            padding: 40px 40px 35px 40px;
            text-align: center;
        }

        .prologue-text {
            font-size: 1.15rem;
            line-height: 1.8;
            letter-spacing: 1px;
            min-height: 2.2em;
        }

        /* ================= 遊戲主畫面 CSS ================= */
        .main-game-layer {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
        }

        .stage-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transition: opacity 1.2s ease-in-out;
            z-index: 1;
            opacity: 0;
        }

        .stage-bg.active {
            opacity: 1;
        }

        .character-portrait {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            max-height: 400px;
            object-fit: contain;
            transition: all 0.5s ease;
            z-index: 2;
        }

        .character-portrait.hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(20px);
        }

        .dialogue-box {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 94%;
            height: 140px;
            background: var(--dialog-bg);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 18px 25px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6), 0 0 15px rgba(212, 197, 169, 0.15);
            transition: border-color 0.3s ease;
        }

        .speaker-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-gold);
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(217, 155, 38, 0.3);
        }

        .dialogue-text {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-white);
            white-space: pre-line;
        }

        .next-indicator {
            position: absolute;
            bottom: 12px;
            right: 20px;
            font-size: 0.9rem;
            color: var(--text-gold);
        }

        .next-indicator.blink {
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(3px); }
        }

        /* ===== 選擇肢選單 ===== */
        .choices-container {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 20;
        }

        .choice-btn {
            position: relative;
            background: rgba(18, 15, 13, 0.92);
            border: 1px solid var(--border-color);
            color: var(--text-white);
            padding: 15px 25px;
            font-family: inherit;
            font-size: 1.05rem;
            text-align: center;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.7);
            overflow: hidden;
            opacity: 0;
            transform: translateY(15px) scale(0.95);
            animation: optionPopIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.27) forwards;
            transition: background 0.25s ease, border-color 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
        }

        @keyframes optionPopIn {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .choice-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(217, 155, 38, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .choice-btn:hover {
            background: linear-gradient(135deg, rgba(217, 155, 38, 0.95) 0%, rgba(180, 120, 20, 0.95) 100%);
            color: #0d0c0b;
            font-weight: bold;
            border-color: #fff2d1;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(217, 155, 38, 0.5);
        }

        .choice-btn:hover::before {
            left: 100%;
        }

        .choice-btn.falling {
            animation: buttonRotateFade 0.8s ease-in-out forwards !important;
            pointer-events: none;
        }

        @keyframes buttonRotateFade {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            20% { transform: translateY(-8px) rotate(-2deg); opacity: 1; }
            100% { transform: translateY(300px) rotate(15deg); opacity: 0; }
        }

        .choice-btn.fade-out {
            animation: buttonFadeOut 0.4s ease forwards !important;
            pointer-events: none;
        }

        @keyframes buttonFadeOut {
            to { opacity: 0; transform: scale(0.9); }
        }
    </style>
</head>
<body>

    <div class="game-stage" id="gameStage" onclick="handleStageClick()">
        
        <!-- 全螢幕閃光與特效層 -->
        <div id="flashOverlay" class="flash-overlay"></div>

        <!-- 遊戲封面遮罩層 (修改為 Chapter 1 黑白極簡風格) -->
        <div id="titleScreen" class="title-screen">
            <div class="title-container">
                <h1 class="game-title">最後的修復</h1>
                <div class="game-subtitle">— 畫冊修復師 —</div>
                <button class="start-btn" onclick="startGame(event)">開始遊戲</button>
            </div>
        </div>

        <!-- 前言/章節遮罩層 -->
        <div id="prologueOverlay" class="prologue-overlay">
            <img id="prologueBg" class="prologue-bg" src="" alt="前言背景">
            
            <!-- 章節卡片（單獨一頁） -->
            <div class="chapter-card" id="chapterCard">
                <div class="chapter-number">- 序章 -</div>
                <div class="chapter-title-main">塵封的畫冊</div>
            </div>

            <!-- 前言故事對話框 -->
            <div class="prologue-textbox" id="prologueTextbox" style="display: none;">
                <p id="prologueText" class="prologue-text"></p>
            </div>
        </div>

        <!-- 主遊戲層 -->
        <div id="mainGameLayer" class="main-game-layer">
            <img id="bgImg1" class="stage-bg active" src="" alt="背景1">
            <img id="bgImg2" class="stage-bg" src="" alt="背景2">
            <img id="charImg" class="character-portrait hidden" src="" alt="立繪">

            <!-- 對話區域 -->
            <div class="dialogue-box">
                <div class="speaker-name" id="speakerName">---</div>
                <div class="dialogue-text" id="dialogueText"></div>
                <div class="next-indicator" id="nextIndicator">▼</div>
            </div>

            <!-- 選擇肢區塊 -->
            <div class="choices-container" id="choicesContainer"></div>
        </div>
    </div>

    <script>
//----------------------------------------------------------------------------
// 放在 script 頂層的全域物件
let gameStats = {
    score: 0,
};
// 默默增加分數的函數
function addScore(points) {
    // 1. 讀取現有分數（若無則預設為 0）
    let currentScore = parseInt(localStorage.getItem('hiddenScore') || '0', 10);
    
    // 2. 累加分數
    currentScore += points;
    
    // 3. 存回 localStorage
    localStorage.setItem('hiddenScore', currentScore);
}
// 當玩家點擊「重新開始」或進入第零張初始畫面時執行
function resetGameScore() {
    localStorage.removeItem('hiddenScore'); 
    // 或者寫 localStorage.setItem('hiddenScore', '0');
    
    console.log("遊戲重新開始，隱藏分數已清空！");
}
//----------------------------------------------------------------------------
    /* =================================================================
       1. 全局圖片與資源路徑設定區
    ================================================================= */
    const PATH_CONFIG = {
        imgBase: "./Picture/Chapter0/",
        
        bg: {
            roomDay:     "E.png",
            roomNight:   "J.png",
            drawerClose: "B.png",
            bookOpen:    "C.png",
            roomDetail:  "D.png",
            flashLight:  "F.png",
            doorOpen:    "G.png",
            toOldHouse:  "I.png",
            oldHouse:    "H.png"
        },

        portrait: {
            damienNormal: "damien_normal.png",
            damienSurprise: "damien_surprise.png"
        }
    };

    function getImg(filename) {
        if (!filename) return null;
        return PATH_CONFIG.imgBase + filename;
    }

    /* =================================================================
       2. Web Audio API 音效系統
    ================================================================= */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playTypeSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400 + Math.random() * 100, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
    }

    function playClickSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    }

    function triggerFlashEffect() {
        const flash = document.getElementById('flashOverlay');
        const stage = document.getElementById('gameStage');
        flash.classList.remove('active');
        stage.classList.remove('shake-effect');
        void flash.offsetWidth;
        flash.classList.add('active');
        stage.classList.add('shake-effect');
        setTimeout(() => stage.classList.remove('shake-effect'), 500);
    }

    /* =================================================================
       3. 前言／章節頁資料庫
    ================================================================= */
    const prologueData = [
        {
            isTitlePage: true,
            bg: null
        },
        {
            bg: getImg(PATH_CONFIG.bg.roomNight),
            text: "地點：祖父的臥室\n（背景傳來陣陣復古音樂聲……）"
        },
        {
            bg: getImg(PATH_CONFIG.bg.roomNight),
            text: "達米安：「(伸懶腰) 今天真是夠累的，一直忙著處理祖父的葬禮，終於有時間整理他的遺物了。」"
        }
    ];

    let gameStarted = false;
    let prologueIndex = 0;
    let isPrologueActive = true;
    let prologueTypeTimer = null;

    let autoAdvanceTimer = null;
    let hasEncounteredFirstChoice = false;

    function startAutoAdvanceTimer(onAdvance) {
        clearTimeout(autoAdvanceTimer);
        autoAdvanceTimer = setTimeout(() => {
            if (!hasEncounteredFirstChoice) {
                if (onAdvance) onAdvance();
            }
        }, 5000);
    }

    function startGame(event) {
        if (event) event.stopPropagation();
        if (gameStarted) return;
        gameStarted = true;
        playClickSound();

        const titleScreen = document.getElementById('titleScreen');
        const prologueOverlay = document.getElementById('prologueOverlay');

        titleScreen.classList.add('fade-out');

        setTimeout(() => {
            titleScreen.classList.add('hidden');
            prologueOverlay.style.display = 'flex';
            renderPrologueSlide(0);

            requestAnimationFrame(() => {
                prologueOverlay.classList.add('show');
            });
        }, 1000);
    }

    function renderPrologueSlide(index) {
        clearInterval(prologueTypeTimer);

        const bgEl = document.getElementById('prologueBg');
        const cardEl = document.getElementById('chapterCard');
        const textboxEl = document.getElementById('prologueTextbox');
        const textEl = document.getElementById('prologueText');
        const data = prologueData[index];

        if (data.isTitlePage) {
            bgEl.style.opacity = '0';
            cardEl.style.display = 'block';
            textboxEl.style.display = 'none';
            startAutoAdvanceTimer(() => nextPrologueSlide());
        } else {
            cardEl.style.display = 'none';
            textboxEl.style.display = 'block';
            textEl.innerText = "";

            bgEl.src = data.bg || "";
            bgEl.style.opacity = data.bg ? '1' : '0';
            bgEl.classList.remove('zoom');
            void bgEl.offsetWidth;
            bgEl.classList.add('zoom');

            startPrologueTypewriter(data.text);
            startAutoAdvanceTimer(() => nextPrologueSlide());
        }
    }

    function startPrologueTypewriter(fullText) {
        const textEl = document.getElementById('prologueText');
        let charIndex = 0;

        prologueTypeTimer = setInterval(() => {
            if (charIndex < fullText.length) {
                textEl.innerText += fullText.charAt(charIndex);
                playTypeSound();
                charIndex++;
            } else {
                clearInterval(prologueTypeTimer);
            }
        }, 40);
    }

    function nextPrologueSlide() {
        if (!isPrologueActive) return;
        prologueIndex++;

        if (prologueIndex < prologueData.length) {
            renderPrologueSlide(prologueIndex);
        } else {
            endPrologue();
        }
    }

    function endPrologue() {
        if (!isPrologueActive) return;
        clearInterval(prologueTypeTimer);
        clearTimeout(autoAdvanceTimer);
        isPrologueActive = false;

        const overlay = document.getElementById('prologueOverlay');
        overlay.classList.remove('show');

        setTimeout(() => {
            overlay.style.display = 'none';
            document.getElementById('mainGameLayer').style.display = 'block';
            renderNode("node_1");
        }, 1200);
    }

    /* =================================================================
       4. 主對話劇本資料庫
    ================================================================= */
    const scenario = {
        "node_1": {
            speaker: "選擇",
            text: "請選擇接下來的行動：",
            bg: getImg(PATH_CONFIG.bg.roomNight),
            portrait: null,
            options: [
                { text: "閱覽：走進祖父的房間", target: "node_2" },
                { text: "尋找：查看門口周圍", target: "search_1" }
            ]
        },
        "search_1": {
            speaker: "達米安",
            text: "「門口掛著一把老舊的金屬鑰匙和乾枯的花環，看起來很久沒人動過了……」",
            next: "node_2"
        },
        "node_2": {
            speaker: "達米安",
            text: "「還是這熟悉的味道，臭得令人懷念。」",
            next: "node_3"
        },
        "node_3": {
            speaker: "選擇",
            text: "請選擇接下來的行動：",
            bg: getImg(PATH_CONFIG.bg.roomNight),
            options: [
                { text: "閱覽：繼續清理房間內容", target: "node_4" },
                { text: "尋找：仔細搜尋角落的雜物", target: "search_2" }
            ]
        },
        "search_2": {
            speaker: "達米安",
            text: "「角落積滿了灰塵，除了幾個發黃的舊報紙和空藥罐外，沒發現別的東西。」",
            next: "node_4"
        },
        "node_4": {
            speaker: "達米安",
            text: "「衣服、檯燈、舊照片… (笑) 我小時候看起來真可愛。」",
            next: "node_5"
        },
        "node_5": {
            speaker: "選擇",
            text: "請選擇接下來的行動：",
            bg: getImg(PATH_CONFIG.bg.drawerClose),
            options: [
                { text: "閱覽：打開抽屜拿出一本老舊的本子", target: "node_6" },
                { text: "尋找：先檢查桌面上的物品", target: "search_3" }
            ]
        },
        "search_3": {
            speaker: "達米安",
            text: "「桌上擺著熄滅的檯燈和一瓶乾涸的墨水，看來最值得注意的還是抽屜裡面……」",
            next: "node_6"
        },
        "node_6": {
            speaker: "達米安",

	    text: "「(震驚) 這裡……這裡是哪裡？我剛剛不是還在祖父的房間裡嗎？怎麼突然到了這個地方。等等，這裡好眼熟，這不就是畫本上祖父畫的老家嗎？！』【序章完】"

    /* =================================================================
       5. 切頁與存檔系統
    ================================================================= */
    function completeChapter0() {
        const saveData = {
            currentChapter: 1,
            startWithDialogue: true
        };

        localStorage.setItem('repairGame_save', JSON.stringify(saveData));
        window.location.href = 'Chapter1.html';
    }

    /* =================================================================
       6. 遊戲運行邏輯
    ================================================================= */
    let currentNodeKey = "node_1";
    let isTyping = false;
    let typeTimer = null;
    let currentFullText = "";
    let bgSequenceTimer = null;
    let isTransitioning = false; 
    let currentBgLayer = 1; 

    const bgImg1 = document.getElementById('bgImg1');
    const bgImg2 = document.getElementById('bgImg2');
    const charImg = document.getElementById('charImg');
    const speakerName = document.getElementById('speakerName');
    const dialogueText = document.getElementById('dialogueText');
    const choicesContainer = document.getElementById('choicesContainer');
    const nextIndicator = document.getElementById('nextIndicator');

    function switchBackground(newImgUrl) {
        if (!newImgUrl) return;

        if (currentBgLayer === 1) {
            bgImg2.src = newImgUrl;
            bgImg2.classList.add('active');
            bgImg1.classList.remove('active');
            currentBgLayer = 2;
        } else {
            bgImg1.src = newImgUrl;
            bgImg1.classList.add('active');
            bgImg2.classList.remove('active');
            currentBgLayer = 1;
        }
    }

    function renderNode(nodeKey) {
    currentNodeKey = nodeKey;
    const node = scenario[nodeKey];

    if (!node) return;

    // ==========================================
    // 💡 在這裡加上隱藏加分檢查：只要這個節點有設定 scoreChange 就自動加分
    if (node.scoreChange !== undefined) {
        addScore(node.scoreChange);
    }
    // ==========================================

    if (nodeKey === "end_demo") {
        speakerName.innerText = node.speaker || "";
        startTypewriter(node.text || "");
        setTimeout(() => {
            completeChapter0();
        }, 2500);
        return;
    }

    choicesContainer.innerHTML = "";
    clearTimeout(bgSequenceTimer);
    clearTimeout(autoAdvanceTimer);
    isTransitioning = false;

    if (node.bgSequence && node.bgSequence.length > 0) {
        isTransitioning = true;
        function playBgStep(seqIndex) {
            const step = node.bgSequence[seqIndex];
            switchBackground(step.bg);

            if (step.duration) {
                bgSequenceTimer = setTimeout(() => {
                    if (seqIndex + 1 < node.bgSequence.length) {
                        playBgStep(seqIndex + 1);
                    } else {
                        isTransitioning = false;
                    }
                }, step.duration);
            } else {
                isTransitioning = false;
            }
        }
        playBgStep(0);
    } else if (node.bg) {
        switchBackground(node.bg);
    }

    if (node.portrait) {
        charImg.src = node.portrait;
        charImg.classList.remove('hidden');
    } else if (node.portrait === null) {
        charImg.classList.add('hidden');
    }

    if (node.specialEffect === 'flash') {
        triggerFlashEffect();
    }

    speakerName.innerText = node.speaker || "";
    
    if (!hasEncounteredFirstChoice) {
        nextIndicator.style.display = "none";
        startAutoAdvanceTimer(() => {
            const currentNode = scenario[currentNodeKey];
            if (currentNode && currentNode.next) {
                renderNode(currentNode.next);
            }
        });
    }

    startTypewriter(node.text || "");
}

    function startTypewriter(text) {
        isTyping = true;
        currentFullText = text;
        dialogueText.innerText = "";
        nextIndicator.style.display = "none";
        
        let index = 0;
        clearInterval(typeTimer);

        typeTimer = setInterval(() => {
            if (index < text.length) {
                dialogueText.innerText += text.charAt(index);
                playTypeSound();
                index++;
            } else {
                completeTypewriter();
            }
        }, 35);
    }

    function completeTypewriter() {
        clearInterval(typeTimer);
        dialogueText.innerText = currentFullText;
        isTyping = false;
        
        const node = scenario[currentNodeKey];
        if (node.options) {
            hasEncounteredFirstChoice = true;
            clearTimeout(autoAdvanceTimer);
            renderOptions(node.options);
            nextIndicator.style.display = "none";
        } else {
            if (hasEncounteredFirstChoice) {
                nextIndicator.innerText = "▼";
                nextIndicator.classList.add('blink');
                nextIndicator.style.display = "block";
            }
        }
    }

    function renderOptions(options) {
        choicesContainer.innerHTML = "";
        options.forEach((opt, idx) => {
            const btn = document.createElement('div');
            btn.className = 'choice-btn';
            btn.innerText = opt.text;
            btn.style.animationDelay = `${idx * 0.15}s`;

            btn.onclick = (e) => {
                e.stopPropagation();
                playClickSound();

                const allBtns = choicesContainer.querySelectorAll('.choice-btn');
                allBtns.forEach(b => b.style.pointerEvents = 'none');

                btn.classList.add('falling');

                allBtns.forEach(otherBtn => {
                    if (otherBtn !== btn) otherBtn.classList.add('fade-out');
                });

                setTimeout(() => {
                    choicesContainer.innerHTML = "";
                    renderNode(opt.target);
                }, 800);
            };
            choicesContainer.appendChild(btn);
        });
    }

    function handleStageClick() {
        if (!gameStarted) return;

        if (currentNodeKey === "end_demo") {
            completeChapter0();
            return;
        }

        if (!hasEncounteredFirstChoice) {
            return;
        }

        if (isPrologueActive) {
            playClickSound();
            nextPrologueSlide();
            return;
        }

        if (isTyping) {
            completeTypewriter();
            return;
        }

        if (isTransitioning) return;

        const node = scenario[currentNodeKey];

        if (node.options && node.options.length > 0) return;

        if (node.next) {
            renderNode(node.next);
        }
    }

    function preloadImages() {
        const urls = new Set();
        prologueData.forEach(item => item.bg && urls.add(item.bg));
        Object.values(scenario).forEach(node => {
            if (node.bg) urls.add(node.bg);
            if (node.bgSequence) {
                node.bgSequence.forEach(item => item.bg && urls.add(item.bg));
            }
            if (node.portrait) urls.add(node.portrait);
        });
        urls.forEach(url => {
            const img = new Image();
            img.src = url;
        });
    }

    window.addEventListener('DOMContentLoaded', preloadImages);
</script>
